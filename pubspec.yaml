name: mio_ani
description: "MioAni cross-platform anime discovery and library application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  dio: ^5.11.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_web_plugins:
    sdk: flutter
  go_router: ^17.3.0
  json_annotation: ^4.12.0
  path_provider: 2.1.6
  web: 1.1.1

dev_dependencies:
  build_runner: 2.15.1
  drift_dev: 2.34.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  go_router_builder: ^4.4.0
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
